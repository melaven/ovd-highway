services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ovd
      POSTGRES_PASSWORD: ovd
      POSTGRES_DB: ovd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovd -d ovd"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  engine:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      # Compose service hostnames override any localhost values in .env.
      DATABASE_URL: postgres://ovd:ovd@postgres:5432/ovd?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # Parallel LLM qualification workers; safe default, clamp 1..10 in engine.
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-3}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # MTProto session.json is written to the working directory (/data).
      - mtproto-session:/data

volumes:
  pgdata:
  mtproto-session:
